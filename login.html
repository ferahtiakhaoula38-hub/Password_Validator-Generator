<!DOCTYPE html>
<html>
    <head>
<style>
    
    body{
        background-color: 	rgb(18, 18, 45); 
        display:flex;
        justify-content:center;
        align-items:center;
    }
    div{
        
        align-items: center;
        margin-top: 150px;
        margin-left: 100px;
        margin-right: 100px;
        margin-bottom: 100px;
        height: 400px;
        width: 800px;
        border: 2px solid black;
        background-color:	rgb(18, 18, 45);
        display:block;
        border-radius: 30px;
        box-shadow: 5px 5px 5px rgb(180, 160, 255);
        
    }
    input{
        width: 600px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 150px;
        margin-left: 100px;
        margin-top: 60px;
        background-color: 	rgb(240, 235, 255);
        border: 3px solid rgb(0, 0, 0);
        border-radius: 5px;
        padding: 10px;
        font-family: poppins;
       
    }
    button{
        width: 300px;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 300px;
        margin-left: 300px;
        margin-top: 20px;
        border: 3px solid rgb(11, 2, 78);
        border-radius: 5px;
        background-color: 	rgb(130, 90, 210);
        color: 	rgb(255, 255, 255));
        font-family: poppins;
        font-size: 20px;
      
    }
    button:hover{
        background-color: rgb(220, 205, 255);
        color: rgb(11, 2, 78);
        border: 3px solid rgb(11, 2, 78);
    }
    button:active{
        background-color: rgb(130, 90, 210);
        color: rgb(246, 242, 242);
        border: 3px solid rgb(11, 2, 78);
    }
</style>
    </head>
        <body>
            <div>
                <input type="password" placeholder="Enter your password">
                <button id="checkPassword">Check Password</button>
                <button id="generatePassword">Generate Password</button>
            </div>
            <script>
                document.querySelector('#checkPassword').addEventListener('click', function() {
                    var password = document.querySelector('input').value;
                     if(password ==''){
                            alert("Password cannot be empty");
                            return;
                        }
                    for(var i=0 ;i<password.length;i++){
                       
                        if(password[i] == ' '){
                            alert("Password cannot contain spaces");
                            return;
                        }
                        else if(password.length < 8){
                            alert("Password must be at least 8 characters long");
                            return;
                        }
                        else if(!/[A-Z]/.test(password))
                       {alert("Password must contain at least one uppercase letter");
                        return;}
                        else if(!/[a-z]/.test(password)){
                            alert("Password must contain at least one lowercase letter");
                            
                            return;
                        }
                        else if(!/[0-9]/.test(password)){
                            alert("Password must contain at least one number");
                            return;
                        }
                        else if(!/[!@#$%^&*()]/.test(password)){
                            alert("Password must contain at least one special character");
                            return;
                        }
                        else{
                            alert("Password is valid");
                            return;
                        }
                    }
                });
                document.querySelector('#generatePassword').addEventListener('click',function()
                   {
                   var uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                   var lowercase = "abcdefghijklmnopqrstuvwxyz";
                   var numbers = "0123456789";
                   var symbols = "!@#$%^&*()";
                   var password = "";
                   var input = document.querySelector('input');
                   for(var i=0;i<3;i++){
                    password += uppercase[Math.floor(Math.random() * uppercase.length)];
                    password += lowercase[Math.floor(Math.random() * lowercase.length)];
                    password += numbers[Math.floor(Math.random() * numbers.length)];
                    password += symbols[Math.floor(Math.random() * symbols.length)];
                   }
              input.value = password;
              alert("Password generated: " + password);
                      
            });
            </script>
        </body>
</html>
